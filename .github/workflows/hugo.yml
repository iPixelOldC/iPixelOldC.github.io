name: deploy

on:
    push:
    # workflow_dispatch:
    # schedule:
    #     # Runs At 14:15 on day-of-month 5.
    #     - cron: "15 14 5 * *"
    # Allows you to run this workflow manually from the Actions tab


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3.0.0
              with:
                  hugo-version: "latest"
                  extended: true

            - name: Build Web
              run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public
        
          ## 部署到服务器
            - name: Deploy to VPS
              uses: easingthemes/ssh-deploy@main
              env:
    # 托管在Github里的远程VPS服务器.ssh文件下的私钥id_rsa
                SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_TENCENT_CAN }}
    # rsync的同步命令参数
                ARGS: "-avzr --delete"
    # Github workplace里生成的静态文件目录，即需要同步到远端VPS的文件/文件夹。
                SOURCE: "./public/"
    # VPS IP地址。也可以如同id_rsa私钥一样，托管在Github，然后采用动态参数，比如${{ secrets.SSH_IP }}
                REMOTE_HOST: 119.91.199.237
    # VPS默认用户名root。
                REMOTE_USER: root
    # 需要同步到的VPS目录
                TARGET: /var/www/html

  # Deployment job
    deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
    
